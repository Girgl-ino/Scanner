<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unser Haushaltsbuch</title>
<meta name="theme-color" content="#2D5BE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushalt">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
img{max-width:100%}[hidden]{display:none!important}button{font:inherit;color:inherit;cursor:pointer}
</style>
<style>
/* Layout: eine schmale App-Spalte. Oben Monatswahl, darunter eine dunkle Summenkarte,
   Hauptkategorien als Diagramm (Antippen zeigt jede einzelne Position), unten Leiste mit grossem Plus. */
:root{
  --font-d:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-b:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#F2F5F7; --ink:#10242B; --ink2:#53676F; --ink3:#8596A0;
  --line:#DCE4E8; --accent:#2D5BE3; --on-accent:#FFFFFF; --accent-soft:#E3EAFC;
  --income:#14905D; --danger:#C93C2B; --panel:#0F2F36; --on-panel:#F2F7F8; --bar:#C6D2EA;
  --shadow:0 10px 30px rgba(16,36,43,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1417; --surface:#162026; --sunk:#1C2A31; --ink:#EAF1F3; --ink2:#9DB0B8; --ink3:#6E828B;
    --line:#26353C; --accent:#7C9BFF; --on-accent:#0B1226; --accent-soft:#1E2B4D;
    --income:#3FD08F; --danger:#FF7A68; --panel:#18383F; --on-panel:#F2F7F8; --bar:#2C3E5F;
    --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1417; --surface:#162026; --sunk:#1C2A31; --ink:#EAF1F3; --ink2:#9DB0B8; --ink3:#6E828B;
  --line:#26353C; --accent:#7C9BFF; --on-accent:#0B1226; --accent-soft:#1E2B4D;
  --income:#3FD08F; --danger:#FF7A68; --panel:#18383F; --on-panel:#F2F7F8; --bar:#2C3E5F;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 130px}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,dl,dd{margin:0}
main{max-width:720px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);max-width:720px;margin:0 auto;padding-block:14px 10px}
.brand{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.monthnav{display:flex;align-items:center;gap:4px;margin-left:-8px}
.monthnav h1{font-family:var(--font-d);font-weight:700;font-size:24px;letter-spacing:-.01em;min-width:9.2ch;text-align:center;text-wrap:balance}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink2);flex:0 0 auto}
.ib:hover{background:var(--sunk)}
.stack{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero{background:var(--panel);color:var(--on-panel);border-radius:26px;padding:22px 22px 20px}
.eyebrow{font-size:13px;font-weight:600;opacity:.72;text-transform:capitalize}
.big{font-family:var(--font-d);font-weight:700;font-size:clamp(40px,12.5vw,58px);line-height:1.02;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;margin-top:6px}
.seg{display:flex;gap:3px;height:9px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.14);margin-top:18px}
.seg span{display:block;min-width:4px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.trio dt{font-size:12px;opacity:.65;font-weight:500}
.trio dd{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.trio .neg{color:#FFB4A8}.trio .pos{color:#8CE8BC}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.card h2{font-family:var(--font-d);font-size:18px;font-weight:700;letter-spacing:-.01em}
.card .sub{color:var(--ink2);font-size:13px;margin-top:2px}
.donutwrap{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:14px}
.donutwrap>svg{flex:0 0 auto;width:150px;height:150px}
.dn{font-family:var(--font-d);font-weight:700;font-size:17px;fill:var(--ink);text-anchor:middle}
.dl{font-size:9px;fill:var(--ink2);text-anchor:middle;font-family:var(--font-b)}
.legend{flex:1 1 200px;min-width:0;display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:12px 1fr auto 16px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0}
.lg:last-child{border-bottom:0}
.lg i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.lg span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lg b{font-variant-numeric:tabular-nums;font-weight:600}
.lg small{color:var(--ink3);font-weight:500;margin-left:6px}
.lg em{color:var(--ink3);display:grid;place-items:center}
.chartbox{margin-top:10px}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--ink3);font-size:10px;font-family:var(--font-b)}
.axs{fill:var(--ink);font-weight:700}
.bar{fill:var(--bar)}.bar.sel{fill:var(--accent)}
.inc{stroke:var(--income);stroke-width:3;stroke-linecap:round;fill:none}
.val{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--font-b)}
.bc{cursor:pointer}
.legend2{display:flex;gap:16px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin-top:6px}
.legend2 i{display:inline-block;vertical-align:middle;margin-right:6px}
.sw1{width:12px;height:12px;border-radius:4px;background:var(--accent)}
.sw2{width:14px;height:3px;border-radius:2px;background:var(--income)}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 2px 0}
.sechead h2{font-family:var(--font-d);font-size:18px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 16px}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0}
.row:last-child{border-bottom:0}
.thumb,.bubble{width:48px;height:48px;border-radius:14px;object-fit:cover;background:var(--sunk)}
.bubble{display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.broken{visibility:hidden}
.rt{min-width:0;display:flex;flex-direction:column}
.rt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt small{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-family:var(--font-d);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.income{color:var(--income)}
.dayhead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:16px 4px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input,.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;font-size:16px}
.sel{width:auto;max-width:100%;padding:8px 12px;font-size:14px;font-weight:600}
.empty{text-align:center;color:var(--ink2);padding:34px 10px}
.cta{display:flex;flex-direction:column;gap:12px}
.cta h2{font-family:var(--font-d);font-size:20px;font-weight:700}
.cta p{color:var(--ink2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:12px 18px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.6}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px}
.notice.warn{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.sk{border-radius:22px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--ink3);font-size:12px;font-weight:700;padding:6px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow)}
.fab[disabled]{opacity:.5}
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(8,16,20,.55)}
.panel{position:relative;width:min(100%,560px);max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);
  border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:up .22s ease-out;display:flex;flex-direction:column;gap:14px}
.panel>div[id$="root"]{display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){#sheet{align-items:center}.panel{border-radius:26px}}
.handle{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.fh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fh h2{font-family:var(--font-d);font-size:22px;font-weight:700}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:20px;padding:16px;font-weight:700}
.cb small{display:block;color:var(--ink2);font-weight:500;font-size:12.5px}
.cb .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--on-accent)}
.cb.alt .ic{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg2.three{grid-template-columns:repeat(3,1fr)}
.seg2 button{border:0;background:transparent;border-radius:11px;padding:9px;font-weight:700;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.amountbox{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:16px;background:var(--sunk);padding:8px 16px}
.amountbox input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-d);font-size:38px;font-weight:700;padding:0;outline:none;font-variant-numeric:tabular-nums}
.amountbox b{font-family:var(--font-d);font-size:26px;color:var(--ink3)}
.catpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.cp{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 6px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.cp .bubble{width:36px;height:36px;border-radius:12px}
.cp[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.item{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--sunk)}
.item .l1{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px;align-items:center}
.item .l2{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:6px}
.item .input{padding:9px 12px;background:var(--surface)}
.item .sel{width:100%;background:var(--surface)}
.mini{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:var(--surface)}
.mini input{width:100%;min-width:0;border:0;background:transparent;padding:10px 0;font-size:16px;text-align:right;outline:none}
.splitsum{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.splitsum.bad{color:var(--danger)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;text-align:left;padding:4px 0}
.statusrow{display:flex;gap:12px;align-items:center}
.rthumb{width:64px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:0 0 auto}
.st{font-size:14px;color:var(--ink2)}.st.ok{color:var(--income);font-weight:600}.st.warn{color:var(--danger)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-size:14px}
.actions{display:flex;gap:10px}.actions .btn{flex:1}
.bigimg{width:100%;max-height:46vh;object-fit:contain;border-radius:16px;background:var(--sunk);border:1px solid var(--line)}
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--ink2)}.kv dd{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.dbig{font-family:var(--font-d);font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.poshead{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:12px 0 4px;align-items:center}
.poshead span:first-child{display:flex;align-items:center;gap:8px}
.poshead i{width:10px;height:10px;border-radius:3px;display:inline-block}
.posrow{display:flex;justify-content:space-between;gap:12px;padding:4px 0 4px 18px;color:var(--ink2)}
.posrow span:first-child{min-width:0;overflow-wrap:anywhere}
.posrow span:last-child{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.ar{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.ar:last-child{border-bottom:0}
.ar b{font-weight:600;overflow-wrap:anywhere}
.ar .v{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ar small{color:var(--ink2);font-size:12.5px}
.ar small:nth-of-type(2){text-align:right}
.bar2{grid-column:1/-1;height:5px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:var(--c);border-radius:5px}
.sumline{color:var(--ink2);font-size:14px}
.qrow{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow b{font-weight:600}
.balbig{font-family:var(--font-d);font-weight:700;font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.balbig.neg{color:var(--danger)}
.hero{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 40%,var(--panel)) 0%,var(--panel) 62%);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.seg{height:11px;border-radius:11px}.seg span{border-radius:6px}
.card{box-shadow:0 1px 0 rgba(16,36,43,.04),0 10px 26px -14px rgba(16,36,43,.28)}
.rows{box-shadow:0 10px 26px -16px rgba(16,36,43,.28)}
.stack>*{animation:rise .4s ease both}
.stack>*:nth-child(2){animation-delay:.05s}.stack>*:nth-child(3){animation-delay:.1s}.stack>*:nth-child(4){animation-delay:.15s}.stack>*:nth-child(5){animation-delay:.2s}.stack>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
nav{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.fab{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#8A4DFF));box-shadow:0 12px 26px -8px color-mix(in srgb,var(--accent) 70%,transparent),0 0 0 6px var(--surface)}
.row:hover{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.bubble{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 24%,transparent)}
.scope{border-radius:999px;padding:4px}.scope button{border-radius:999px}
.lg{grid-template-columns:34px 1fr auto 16px}
.lg i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 24%,transparent)}
.lg:active,.row:active,.ghead:active{transform:scale(.99)}
.donutwrap>svg circle{transition:stroke-dasharray .5s ease}
.ghead{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.gt{display:flex;flex-direction:column;min-width:0}
.gt b{font-weight:700;overflow-wrap:anywhere}
.gt small{color:var(--ink2);font-size:12.5px}
.ghead .v{font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ghead .chev{color:var(--ink3);display:grid;place-items:center}
.ghead .bar2{grid-column:1/-1}
.gitems{padding:0 0 6px 14px;margin-left:4px;border-left:3px solid var(--line)}
.scope button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}

}
function catItems(cat){
  var ms=rangeMonths(),groups={},total=0;

    var sk=sub||'',nm=String(name||'Sonstiges').trim()||'Sonstiges';
    var g=groups[sk]||(groups[sk]={sub:sk,sum:0,agg:{}});
    var key=(plain?'~':'')+nm.toLowerCase();
    var o=g.agg[key]||(g.agg[key]={name:nm,sum:0,qty:0,count:0,plain:!!plain,label:label||''});
    o.sum+=amount;o.qty+=qty;o.count++;g.sum+=amount;total+=amount;
  }
  ents().forEach(function(e){
    if(e.type!=='expense'||!e.date||ms.indexOf(e.date.slice(0,7))<0)return;
    if(hasItems(e)){e.items.forEach(function(i){if(i.cat===cat)add(i.name,i.amount,i.qty||1,false,i.sub);});}
    else parts(e).forEach(function(p){if(p.cat===cat)add(e.title||p.cat,p.amount,1,true,'');});
  });

  }).sort(function(a,b){return b.sum-a.sum;});

}

function donut(byCat,total){
  var R=52,C=2*Math.PI*R,off=0;
  var items=Object.keys(byCat).filter(function(k){return byCat[k]>0.004;}).sort(function(a,b){return byCat[b]-byCat[a];});
  var pos=items.reduce(function(a,k){return a+byCat[k];},0)||1;
  var segs='';
  if(!items.length)segs='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="16"/>';
  items.forEach(function(k){
    var len=byCat[k]/pos*C,vis=Math.max(len-1.5,0.5);
    segs+='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+catMeta(k).color+'" stroke-width="16" stroke-dasharray="'+vis+' '+(C-vis)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off+=len;
  });
  return {svg:'<svg viewBox="0 0 140 140" role="img" aria-label="Ausgaben nach Kategorie">'+segs+'<text x="70" y="70" class="dn">'+eur0.format(total)+'</text><text x="70" y="86" class="dl">Ausgaben</text></svg>',items:items,pos:pos};
}
function niceCeil(m){var p=Math.pow(10,Math.floor(Math.log10(m)));var n=m/p;var c=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return c*p;}
function axis(v){return v>=1000?(v/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+' k':String(Math.round(v));}
function barChart(){
  var ms=[0,1,2,3,4,5].map(function(i){return addMonth(S.month,i-5);});
  var st=ms.map(function(k){return monthStats(k);});
  var mx=Math.max.apply(null,st.map(function(s){return Math.max(s.exp,s.inc);}).concat([1]));
  var top=niceCeil(mx),W=340,H=196,L=38,R=6,T=24,B=26,pw=W-L-R,ph=H-T-B,step=pw/6,bw=Math.min(30,step*0.56);
  function y(v){return T+ph*(1-v/top);}
  var g='';
  [0,0.5,1].forEach(function(f){var v=top*f;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" class="gl"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end" class="ax">'+axis(v)+'</text>';});
  st.forEach(function(s,i){
    var cx=L+step*i+step/2,sel=i===5;
    g+='<g data-a="month" data-v="'+ms[i]+'" class="bc"><rect x="'+(L+step*i)+'" y="'+(T-16)+'" width="'+step+'" height="'+(ph+B+16)+'" fill="transparent"/>';
    if(s.exp>0)g+='<rect x="'+(cx-bw/2)+'" y="'+y(s.exp)+'" width="'+bw+'" height="'+(ph*s.exp/top)+'" rx="6" class="bar'+(sel?' sel':'')+'"/>';
    if(s.inc>0)g+='<path d="M'+(cx-bw/2-4)+' '+y(s.inc)+'H'+(cx+bw/2+4)+'" class="inc"/>';
    if(sel&&s.exp>0)g+='<text x="'+cx+'" y="'+(y(s.exp)-6)+'" text-anchor="middle" class="val">'+eur0.format(s.exp)+'</text>';
    g+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" class="ax'+(sel?' axs':'')+'">'+esc(monthShort(ms[i]))+'</text></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ausgaben der letzten sechs Monate">'+g+'</svg>';
}

function compress(file,max,q){
  var url=URL.createObjectURL(file);
  return new Promise(function(res,rej){
    var i=new Image();
    i.onload=function(){
      var sc=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),w=Math.round(i.naturalWidth*sc),h=Math.round(i.naturalHeight*sc);
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(i,0,0,w,h);
      c.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error('blob'));},'image/jpeg',q);
    };
    i.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
    i.src=url;
  });
}
function toDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(b);});}
async function storeImage(blob){
  var tries=[[1400,0.72],[1200,0.65],[1000,0.58],[800,0.5]];
  for(var i=0;i<tries.length;i++){var b=await compress(blob,tries[i][0],tries[i][1]);var d=await toDataUrl(b);if(d.length<700000){var id=await window.HH.putPhoto(d);PH[id]=d;return {photo:id};}}
  throw new Error('image_too_big');
}

function num(v){var n=typeof v==='number'?v:parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?round2(n):null;}
function applyReceipt(r){
  r=r||{};
  var raw=(Array.isArray(r.items)?r.items:[]).map(function(s){
    var a=typeof (s&&s.amount)==='number'?s.amount:parseFloat(String(s&&s.amount!=null?s.amount:'').replace(',','.'));
    var cc=s&&EXP[s.cat]?s.cat:'Sonstiges',ss=String(s&&s.sub||'');
    return {name:String(s&&s.name||'').trim().slice(0,60)||'Artikel',cat:cc,sub:(SUBS[cc]&&SUBS[cc].indexOf(ss)>-1)?ss:'',a:a,qty:Math.max(1,Math.round(Number(s&&s.qty)||1))};
  }).filter(function(s){return isFinite(s.a)&&s.a!==0;});
  var sum=round2(raw.reduce(function(a,s){return a+s.a;},0));
  var rt=num(r.total),removed=0;
  if(rt&&sum-rt>0.01){
    var seenK={},dups=[];
    raw.forEach(function(s,ix){var k=s.name.toLowerCase()+'|'+s.a;if(seenK[k]!==undefined)dups.push(ix);else seenK[k]=ix;});
    dups.sort(function(a,b){return raw[b].a-raw[a].a;});
    var rem=[],cur=sum;
    dups.forEach(function(ix){if(cur-raw[ix].a>=rt-0.01&&cur-rt>0.01){rem.push(ix);cur=round2(cur-raw[ix].a);}});
    if(Math.abs(cur-rt)<0.01&&rem.length){raw=raw.filter(function(s,ix){return rem.indexOf(ix)<0;});sum=cur;removed=rem.length;}
  }
  var total=rt||(sum>0?sum:null);
  if(total&&!F.touched.amount)F.amount=toAmtStr(total);
  if(r.store&&!F.touched.title)F.title=String(r.store).slice(0,80);
  var ok=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(r.date||''));
  if(ok&&+ok[1]>=2000&&+ok[1]<=new Date().getFullYear()+1&&!F.touched.date)F.date=ok[0];
  if(raw.length&&!F.touched.items){
    F.items=raw.map(function(s){return {name:s.name,cat:s.cat,sub:s.sub,amt:toAmtStr(s.a),qty:s.qty};});
    F.cat=groupItems(raw.map(function(s){return {cat:s.cat,amount:s.a};}))[0].cat;
  }
  var ltr=num(r.liters);
  if(ltr&&!F.touched.liters)F.liters=toAmtStr(ltr);
  if(ltr&&!raw.length&&!F.touched.items)F.cat='Tanken';
  if(r.note&&!F.touched.note)F.note=String(r.note).slice(0,200);
  if(total||raw.length){F.status='done';F.msg=(removed?removed+' doppelt gelesene Zeile'+(removed>1?'n':'')+' entfernt. ':'')+(total&&Math.abs(round2(total-sum))>=0.01?'Die Positionen weichen um '+fmt(Math.abs(round2(total-sum)))+' vom Gesamtbetrag ab. Bitte prüfen.':'');}
  else{F.status='fail';F.msg='Auf dem Foto war nichts Lesbares. Trag die Daten bitte von Hand ein. Das Foto wird trotzdem gespeichert.';}
}

function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){if(window.pdfjsLib){window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib);}else rej(new Error('pdf'));};
    s.onerror=function(){rej(new Error('pdf'));};
    document.head.appendChild(s);
  });
}
function isPdf(f){return f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');}
async function pdfToBlobs(file){
  var lib=await loadPdfJs();
  var doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  var out=[],n=Math.min(doc.numPages,6);
  for(var p=1;p<=n;p++){
    var page=await doc.getPage(p),v0=page.getViewport({scale:1});
    var vp=page.getViewport({scale:Math.min(4,1600/Math.max(v0.width,v0.height))});
    var c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    var cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:cx,viewport:vp}).promise;
    out.push(await new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'));},'image/jpeg',0.8);}));
  }
  return out;
}
async function toBlobs(files){
  var out=[];
  for(var i=0;i<files.length;i++){
    if(isPdf(files[i])){var ps=await pdfToBlobs(files[i]);for(var j=0;j<ps.length;j++)out.push(ps[j]);}
    else out.push(await compress(files[i],1600,0.78));
  }
  return out;
}

  return '<div class="field"><span>Tankdaten</span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="mini"><input id="f-liters" inputmode="decimal" placeholder="Liter" value="'+esc(F.liters||'')+'" aria-label="Liter"><b>l</b></div><div class="mini"><input id="f-km" inputmode="numeric" placeholder="Kilometerstand" value="'+esc(F.km||'')+'" aria-label="Kilometerstand"><b>km</b></div></div><p class="sub" id="f-ppl">'+pplText()+'</p></div>';
}
function fuelBlock(cat){
  if(cat!=='Tanken')return '';
  var ms=rangeMonths();
  var fl=ents().filter(function(e){return e.type==='expense'&&e.fuel&&e.fuel.liters>0&&e.date&&ms.indexOf(e.date.slice(0,7))>-1;}).sort(function(a,b){return a.date.localeCompare(b.date);});
  if(!fl.length)return '<p class="sub">Trag beim Tanken die Liter ein, dann siehst du hier Literpreis und Verbrauch.</p>';
  var lit=0,cost=0,nf=function(v,d){return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});};
  fl.forEach(function(e){lit+=e.fuel.liters;cost+=e.fuel.liters*(e.fuel.ppl||0);});
  var kms=fl.filter(function(e){return e.fuel.km;}).sort(function(a,b){return a.fuel.km-b.fuel.km;}),cons=null;
  if(kms.length>1){var dist=kms[kms.length-1].fuel.km-kms[0].fuel.km,l2=0;kms.slice(1).forEach(function(e){l2+=e.fuel.liters;});if(dist>0)cons=l2/dist*100;}
  var best=fl.reduce(function(m,e){return (e.fuel.ppl||9e9)<(m.fuel.ppl||9e9)?e:m;},fl[0]);
  return '<dl class="kv"><div><dt>Getankt</dt><dd>'+nf(lit,1)+' l in '+fl.length+(fl.length===1?' Tankvorgang':' Tankvorgängen')+'</dd></div><div><dt>Ø Preis pro Liter</dt><dd>'+nf(lit>0?cost/lit:0,3)+' €</dd></div><div><dt>Günstigster Literpreis</dt><dd>'+nf(best.fuel.ppl||0,3)+' € · '+esc(dayLabel(best.date))+'</dd></div>'+(cons?'<div><dt>Ø Verbrauch (bei vollem Tank)</dt><dd>'+nf(cons,1)+' l/100 km</dd></div>':'')+'</dl>';
}
function mine(x){if(!S.me)return true;return x.by?x.by===S.me:S.isOwner;}
function inScope(x,sc){sc=sc||S.scope;return sc==='all'||((sc==='me')===mine(x));}
function ents(sc){return S.entries.filter(function(e){return inScope(e,sc);});}
function recActive(k,sc){return S.rec.filter(function(r){return inScope(r,sc)&&r.from<=k&&(!r.to||r.to>=k);});}
function myName(){return S.names[S.me]||'Ich';}
function otherName(){
  var id=null;
  S.entries.concat(S.rec).forEach(function(x){if(!id&&x.by&&x.by!==S.me)id=x.by;});
  if(!id){var H=window.HH,all=Object.keys(H.members.names||{});id=all.filter(function(u){return u!==S.me;})[0]||null;}
  return (id&&S.names[id])||(window.HH.isAdmin?'Franziska':'Georg');
}
function scopeHTML(){
  function b(v,l){return '<button data-a="scope" data-v="'+v+'" aria-pressed="'+(S.scope===v)+'">'+esc(l)+'</button>';}
  return '<div class="seg2 three scope" role="group" aria-label="Ansicht" style="margin-top:6px">'+b('me',myName())+b('other',otherName())+b('all','Gesamt')+'</div>';
}
async function loadNames(){
  if(!S.user||!S.user.profiles)return;
  var ids=[];
  S.entries.concat(S.rec).forEach(function(x){if(x.by&&ids.indexOf(x.by)<0)ids.push(x.by);});
  if(S.me&&ids.indexOf(S.me)<0)ids.push(S.me);
  (window.HH.members.uids||[]).forEach(function(u){if(ids.indexOf(u)<0)ids.push(u);});
  var key=ids.join(',');
  if(!ids.length||key===S._nk)return;
  S._nk=key;
  try{
    var ps=await S.user.profiles(ids);
    ids.forEach(function(id){var n=String((ps[id]&&ps[id].name)||'').trim().split(' ')[0];if(n)S.names[id]=n;});
    render();
  }catch(e){}
}

function syncRec(){
  if(!R||!$('#r-title'))return;
  R.title=$('#r-title').value;R.amount=$('#r-amount').value;R.from=$('#r-from').value;R.to=$('#r-to').value;R.cat=$('#r-cat').value;
  if($('#r-sub'))R.sub=$('#r-sub').value;
}
async function saveRec(){
  syncRec();
  var er=function(m){var el=$('#r-err');if(el)el.textContent=m;};
  var amount=parseAmt(R.amount);
  if(!(amount>0))return er('Bitte gib einen Betrag ein.');
  if(!/^\d{4}-\d{2}$/.test(R.from))return er('Bitte wähle den Monat, ab dem es gilt.');
  if(R.to&&(!/^\d{4}-\d{2}$/.test(R.to)||R.to<R.from))return er('Das Ende darf nicht vor dem Start liegen.');
  var doc={by:R.id?(R.by||null):(S.me||null),type:R.type,title:R.title.trim(),amount:round2(amount),cat:R.cat,sub:R.type==='income'?'':(R.sub||''),from:R.from,to:R.to||null,updatedAt:Date.now()};
  try{
    if(S.caps.db){var id=R.id||S.caps.db.collection('recurring').doc().id;await S.caps.db.doc('recurring/'+id).set(doc);}
    else{doc.id=R.id||('l'+Date.now());S.rec=S.rec.filter(function(x){return x.id!==doc.id;}).concat([doc]);}
  }catch(x){return er('Speichern hat nicht geklappt. Bitte versuch es noch einmal.');}
  R=null;$('#fixroot').innerHTML=fixHTML();render();toast('Gespeichert');
}

/* ---------- Mehrere Belege auf einmal ---------- */
var B=null;
function batchHTML(){
  var done=B.q.filter(function(x){return x.status==='ok'||x.status==='fail'||x.status==='dup'||x.status==='queued';}).length;
  var rows=B.q.map(function(x){
    var st=x.status==='wait'?'Wartet':x.status==='read'?'<span class="spin"></span>Wird gelesen …':x.status==='queued'?'Gespeichert. Wird im Hintergrund erneut ausgelesen.':x.status==='dup'?'Schon vorhanden (gleiches Datum und gleicher Betrag), übersprungen.':x.status==='ok'?'Gespeichert · '+fmt(x.amount)+(x.n?' · '+x.n+' Positionen':'')+(x.warn?'. '+x.warn:''):'Nicht lesbar. Das Foto ist gespeichert, bitte unter Belege ergänzen.';
    return '<div class="qrow"><b>'+esc(x.title)+'</b><span class="st'+(x.status==='ok'?' ok':x.status==='fail'?' warn':'')+'">'+st+'</span></div>';
  }).join('');
  return '<div class="handle"></div><div class="fh"><h2>Belege hochladen</h2><button class="ib" data-a="close" aria-label="Schließen">'+icon('x')+'</button></div><p class="sumline">'+done+' von '+B.q.length+' fertig</p><div>'+rows+'</div>'+
    (done===B.q.length?'<button class="btn primary" data-a="close">Fertig</button>':'<p class="sub">Du kannst das Fenster schließen. Die Belege werden weiter verarbeitet.</p>');
}
async function persistBatch(f,blobs,amount){
  var blob=blobs[0];
  var img=S.caps.db?await storeImage(blob):{url:URL.createObjectURL(blob)};
  var more=[];
  for(var mi=1;mi<blobs.length;mi++)more.push(S.caps.db?await storeImage(blobs[mi]):{url:URL.createObjectURL(blobs[mi])});
  var items=null,splits=null,cat=f.cat||'Sonstiges';
  if(f.items.length){
    var it=f.items.map(function(i){return {name:(i.name||'').trim()||'Artikel',cat:i.cat,sub:i.sub||'',amount:round2(parseAmt(i.amt)),qty:i.qty||1};}).filter(function(i){return isFinite(i.amount)&&i.amount!==0;});
    if(it.length){
      var sum=round2(it.reduce(function(a,i){return a+i.amount;},0)),diff=round2(amount-sum);
      if(amount>0&&Math.abs(diff)>=0.01)it.push({name:'Differenz zum Kassenbetrag',cat:'Sonstiges',amount:diff,qty:1});
      items=it;splits=groupItems(it);cat=splits[0].cat;
    }
  }
  var id=S.caps.db?S.caps.db.collection('entries').doc().id:'l'+Date.now()+Math.random();
  var e={type:'expense',amount:round2(amount>0?amount:0),date:f.date,title:f.title.trim()||'Beleg (bitte prüfen)',cat:cat,items:items,splits:splits,note:f.note||'',img:img,more:more.length?more:null,fuel:(parseAmt(f.liters)>0&&amount>0)?{liters:round2(parseAmt(f.liters)),ppl:Math.round(amount/parseAmt(f.liters)*1000)/1000,km:null}:null,source:'beleg',by:S.me||null,pending:!!f.pending,createdAt:Date.now(),updatedAt:Date.now()};
  if(f.pending){e.title='Beleg wird ausgelesen …';}
  if(S.caps.db)await S.caps.db.doc('entries/'+id).set(e);
  else{e.id=id;S.entries=S.entries.concat([e]);}
  return e;
}
async function startBatch(files){
  B={q:files.map(function(f,i){return {file:f,status:'wait',title:'Beleg '+(i+1),amount:0,n:0};})};
  openSheet('<div id="batchroot">'+batchHTML()+'</div>');
  var upd=function(){var r=$('#batchroot');if(r)r.innerHTML=batchHTML();};
  var okCount=0,lastDate=null,seen=[];
  for(var i=0;i<B.q.length;i++){
    var x=B.q[i];x.status='read';upd();
    try{
      var blobs=await toBlobs(x.file);
      var tmp={type:'expense',amount:'',date:todayStr(),title:'',cat:'Sonstiges',items:[],note:'',touched:{}};
      if(S.caps.images){
        try{var r=await S.caps.sample.json(receiptPrompt(blobs.length),{images:blobs});F=tmp;applyReceipt(r);}catch(e){if(transient(e))tmp.pending=true;}
        F=null;
      }
      var amount=parseAmt(tmp.amount);
      if(amount>0&&(seen.some(function(s){return s.d===tmp.date&&Math.abs(s.a-amount)<0.005;})||findDup(tmp.date,amount,null))){x.status='dup';x.title=tmp.title||x.title;x.amount=amount;upd();continue;}
      var e=await persistBatch(tmp,blobs,amount);
      x.title=e.title;x.amount=e.amount;x.n=e.items?e.items.length:0;
      x.status=amount>0?'ok':(tmp.pending?'queued':'fail');x.warn=tmp.msg||'';lastDate=e.date;if(amount>0){okCount++;seen.push({d:e.date,a:amount});}
    }catch(err){F=null;x.status='fail';}
    upd();
  }
  if(lastDate)S.month=lastDate.slice(0,7);
  render();
  toast(okCount+' von '+B.q.length+' Belegen gespeichert');
}

/* ---------- Speichern ---------- */
async function saveEntry(){
  if(!F||F.saving)return;
  var err=function(m){var el=$('#f-err');if(el)el.textContent=m;};
  var inc=F.type==='income',amount=parseAmt(F.amount);
  if(!(amount>0))return err('Bitte gib einen Betrag ein.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date))return err('Bitte wähle ein Datum.');
  var cat=F.cat,items=null,splits=null;
  if(!inc&&F.items.length){
    var it=F.items.map(function(i){return {name:(i.name||'').trim()||'Artikel',cat:i.cat,sub:i.sub||'',amount:round2(parseAmt(i.amt)),qty:i.qty||1};}).filter(function(i){return isFinite(i.amount)&&i.amount!==0;});
    if(it.length){
      var sum=round2(it.reduce(function(a,i){return a+i.amount;},0)),diff=round2(amount-sum);
      if(Math.abs(diff)>=0.01)it.push({name:'Differenz zum Kassenbetrag',cat:'Sonstiges',amount:diff,qty:1});
      items=it;splits=groupItems(it);cat=splits[0].cat;
    }
  }
  if(!items&&!inc&&F.sub&&SUBS[cat]&&SUBS[cat].indexOf(F.sub)>-1){items=[{name:(F.title||F.sub).trim(),cat:cat,sub:F.sub,amount:round2(amount),qty:1}];splits=groupItems(items);}
  if(F.mode==='new'&&!F.dupOk&&!inc&&findDup(F.date,amount,null)){F.dupOk=true;return err('Ein Beleg mit gleichem Datum und gleichem Betrag ist schon vorhanden. Ist es wirklich ein anderer, tippe noch einmal auf Speichern.');}
  var btn=$('#f-save');F.saving=true;if(btn){btn.disabled=true;btn.textContent='Speichert …';}
  var e;
  try{
    var img=F.img;
    if(F.photoBlob)img=S.caps.db?await storeImage(F.photoBlob):{url:F.previewUrl};
    var more=F.more||null;
    if(F.moreBlobs&&F.moreBlobs.length){more=[];for(var mi=0;mi<F.moreBlobs.length;mi++)more.push(S.caps.db?await storeImage(F.moreBlobs[mi]):{url:URL.createObjectURL(F.moreBlobs[mi])});}
    var fuel=null;
    if(isFuel()){
      var lt=parseAmt(F.liters),kmv=parseAmt(F.km),fa=amount;
      if(items){var tf=items.filter(function(i){return i.cat==='Tanken';}).reduce(function(a,i){return a+i.amount;},0);if(tf>0)fa=tf;}
      if(lt>0)fuel={liters:round2(lt),ppl:Math.round(fa/lt*1000)/1000,km:kmv>0?Math.round(kmv):null};
    }
    var id=F.id||(S.caps.db?S.caps.db.collection('entries').doc().id:'l'+Date.now());
    e={type:F.type,amount:round2(amount),date:F.date,title:F.title.trim(),cat:cat,items:items,splits:splits,note:F.note.trim(),img:img||null,more:more,
       fuel:fuel,by:F.mode==='edit'?(F.by||null):(S.me||null),source:(F.photoBlob||F.img)?'beleg':'manuell',createdAt:F.createdAt||Date.now(),updatedAt:Date.now()};
    if(S.caps.db)await S.caps.db.doc('entries/'+id).set(e);
    else{e.id=id;S.entries=S.entries.filter(function(x){return x.id!==id;}).concat([e]);}
  }catch(ex){
    F.saving=false;if(btn){btn.disabled=false;btn.textContent='Speichern';}
    return err(ex&&ex.message==='image_too_big'?'Das Foto ist zu groß zum Speichern. Bitte mach ein neues, etwas weiter entfernt.':'Speichern hat nicht geklappt. Bitte versuch es noch einmal.');
  }
  S.month=e.date.slice(0,7);if(S.scope==='other')S.scope='me';
  closeSheet();toast(inc?'Einnahme gespeichert':'Beleg gespeichert');render();
}
async function doDelete(id){
  var e=S.entries.find(function(x){return x.id===id;});
  try{
    if(S.caps.db)await S.caps.db.doc('entries/'+id).delete();else S.entries=S.entries.filter(function(x){return x.id!==id;});
    if(e)window.HH.deletePhotos([e.img].concat(e.more||[]));
  }catch(x){toast('Löschen hat nicht geklappt. Bitte versuch es noch einmal.');return;}
  closeSheet();toast('Eintrag gelöscht');render();
}


/* ---------- Warteschlange: Belege, die nicht gelesen werden konnten, werden von selbst erneut versucht ---------- */
var PQ={busy:false,next:{},tries:{}};
function transient(e){return !!e&&(e.code==='busy'||e.code==='network'||e.code==='rate_limited');}
function pendingList(){return S.entries.filter(function(x){return x.pending&&mine(x);});}
async function queueFromForm(my){
  try{
    var img=await storeImage(my.photoBlob),more=[];
    for(var i=0;my.moreBlobs&&i<my.moreBlobs.length;i++)more.push(await storeImage(my.moreBlobs[i]));
    var id=S.caps.db.collection('entries').doc().id;
    await S.caps.db.doc('entries/'+id).set({type:'expense',amount:0,date:my.date||todayStr(),title:'Beleg wird ausgelesen …',cat:'Sonstiges',items:null,splits:null,note:'',img:img,more:more.length?more:null,fuel:null,by:S.me||null,source:'beleg',pending:true,createdAt:Date.now(),updatedAt:Date.now()});
    closeSheet();toast('Beleg gespeichert. Er wird im Hintergrund erneut ausgelesen.');
    setTimeout(pendingTick,25000);
  }catch(x){my.msg=(my.msg||'')+' Das Foto konnte nicht zwischengespeichert werden.';rerenderForm();}
}
async function pendingTick(){
  if(PQ.busy||F||!S.caps.db||!S.caps.images||!S.caps.sample||(navigator.onLine===false))return;
  var e=pendingList().filter(function(x){return !PQ.next[x.id]||PQ.next[x.id]<=Date.now();})[0];
  if(!e)return;
  PQ.busy=true;
  try{
    var blobs=[],imgs=[e.img].concat(e.more||[]).filter(Boolean);
    for(var i=0;i<imgs.length;i++){
      var src=imgSrc(imgs[i]);
      if(imgs[i].photo&&src===BLANK)src=await window.HH.getPhoto(imgs[i].photo);
      if(!src)throw {code:'image_rejected'};
      blobs.push(await (await fetch(src)).blob());
    }
    var tmp={type:'expense',amount:'',date:e.date||todayStr(),title:'',cat:'Sonstiges',items:[],note:'',touched:{}};
    var r=await S.caps.sample.json(receiptPrompt(blobs.length),{images:blobs});
    var keep=F;F=tmp;try{applyReceipt(r);}finally{F=keep;}
    var amount=parseAmt(tmp.amount);
    var d={};Object.keys(e).forEach(function(k){if(k!=='id')d[k]=e[k];});
    d.pending=false;d.updatedAt=Date.now();
    if(amount>0){
      var items=null,splits=null,cat=tmp.cat||'Sonstiges';
      if(tmp.items.length){
        var it=tmp.items.map(function(i){return {name:(i.name||'').trim()||'Artikel',cat:i.cat,sub:i.sub||'',amount:round2(parseAmt(i.amt)),qty:i.qty||1};}).filter(function(i){return isFinite(i.amount)&&i.amount!==0;});
        if(it.length){var sum=round2(it.reduce(function(a,i){return a+i.amount;},0)),diff=round2(amount-sum);if(Math.abs(diff)>=0.01)it.push({name:'Differenz zum Kassenbetrag',cat:'Sonstiges',amount:diff,qty:1});items=it;splits=groupItems(it);cat=splits[0].cat;}
      }
      d.amount=round2(amount);d.date=tmp.date;d.title=(tmp.title||'').trim()||'Beleg (bitte prüfen)';d.cat=cat;d.items=items;d.splits=splits;
      d.note=tmp.msg||'';
      var lt=parseAmt(tmp.liters);d.fuel=lt>0?{liters:round2(lt),ppl:Math.round(amount/lt*1000)/1000,km:null}:null;
      if(findDup(d.date,d.amount,e.id))d.note=(d.note?d.note+' ':'')+'Möglicherweise doppelt: gleicher Tag und Betrag wie ein anderer Beleg.';
    }else{d.title='Beleg (bitte prüfen)';d.note='Nicht lesbar. Bitte von Hand ergänzen.';}
    await S.caps.db.doc('entries/'+e.id).set(d);
    delete PQ.next[e.id];delete PQ.tries[e.id];
    toast(amount>0?'Beleg im Hintergrund gelesen: '+d.title:'Ein Beleg war nicht lesbar');
  }catch(err){

    });
  };
  const models = prov === 'gemini' ? ['gemini-flash-latest', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-flash-lite-latest'] : ['x'];
  let res;
  try {
    outer: for (let m = 0; m < models.length; m++) {
      for (let t = 0; t < 2; t++) {
        res = await call(models[m]);
        if (res.status !== 503 && res.status !== 500 && res.status !== 429 && res.status !== 404) break outer;
        if (opts && opts.signal && opts.signal.aborted) throw { name: 'AbortError' };
        await wait(1500 * (t + 1));
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') throw { code: 'cancelled' };
    throw { code: 'network', detail: String(e && e.message || e) + ' · ' + prov };
  }
  if (res.status === 503) throw { code: 'busy' };
  if (res.status === 429) throw { code: 'rate_limited' };
  if (res.status === 401 || res.status === 403) throw { code: 'not_granted', detail: String(res.status) };
  if (!res.ok) { let t = ''; try { t = (await res.text()).slice(0, 160); } catch (e) {} throw { code: 'image_rejected', detail: res.status + ' ' + t }; }
  const j = await res.json();
  const text = prov === 'gemini'
    ? ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts || []).map((p) => p.text || '').join(''))
    : ((j.content || []).map((p) => p.text || '').join(''));
  return parseJson(text);
}
const sampleAdapter = { json: aiJson, limits: async () => ({ images: !!HH.ai.key }) };

const userAdapter = {
  can: async () => HH.member, id: async () => HH.uid, isOwner: async () => HH.isAdmin,
  profiles: async (ids) => { const o = {}; ids.forEach((id) => { o[id] = { name: HH.members.names[id] || '' }; }); return o; }
};

window.claude = { use: (n) => Promise.resolve(({ db: dbAdapter, user: userAdapter, sample: sampleAdapter, assets: null })[n] || null) };

/* ---------- Verwaltung ---------- */
HH.approve = async (uid, name) => {
  const uids = HH.members.uids.includes(uid) ? HH.members.uids : HH.members.uids.concat([uid]);
  const names = Object.assign({}, HH.members.names, { [uid]: name || 'Mitglied' });
  await setDoc(doc(db, 'hh_meta', 'members'), { uids, names });
  await deleteDoc(doc(db, 'hh_requests', uid)).catch(() => {});
};
HH.removeMember = async (uid) => {
  const uids = HH.members.uids.filter((u) => u !== uid);
  const names = Object.assign({}, HH.members.names); delete names[uid];
  await setDoc(doc(db, 'hh_meta', 'members'), { uids, names });
};
HH.saveAI = async (provider, key) => {
  await setDoc(doc(db, 'hh_meta', 'ai'), { provider, key });
  HH.ai = { provider, key };
  emit();
};
HH.logout = () => signOut(auth).then(() => location.reload());
HH.importData = async (obj, progress) => {
  let n = 0;
  const list = obj.entries || [];
  for (const e of list) {
    const d = Object.assign({}, e); const id = d.id; delete d.id;
    if (d.img && d.img.data) d.img = { photo: await HH.putPhoto(d.img.data) };
    if (Array.isArray(d.more)) { const m = []; for (const x of d.more) m.push(x && x.data ? { photo: await HH.putPhoto(x.data) } : x); d.more = m; }
    d.by = HH.uid;
    await setDoc(doc(db, 'hh_entries', id), clean(d));
    n++; if (progress) progress(n, list.length);
  }
  for (const r of (obj.recurring || [])) { const d = Object.assign({}, r); const id = d.id; delete d.id; d.by = HH.uid; await setDoc(doc(db, 'hh_recurring', id), clean(d)); }
  return n;
};

/* ---------- Anmeldung ---------- */
const AUTHERR = {
  'auth/invalid-credential': 'E-Mail oder Passwort stimmen nicht.', 'auth/wrong-password': 'E-Mail oder Passwort stimmen nicht.',
  'auth/user-not-found': 'E-Mail oder Passwort stimmen nicht.', 'auth/invalid-email': 'Das ist keine gültige E-Mail-Adresse.',
  'auth/email-already-in-use': 'Zu dieser E-Mail gibt es schon ein Konto. Bitte melde dich an.',
  'auth/weak-password': 'Das Passwort ist zu kurz. Bitte mindestens 6 Zeichen.', 'auth/too-many-requests': 'Zu viele Versuche. Bitte warte kurz.',
  'auth/network-request-failed': 'Keine Verbindung. Bitte prüfe das Internet.', 'auth/missing-password': 'Bitte gib ein Passwort ein.'
};
function gate(html) { const g = $('#gate'); g.innerHTML = '<div class="gcard">' + html + '</div>'; g.hidden = false; }
function hideGate() { const g = $('#gate'); g.hidden = true; g.innerHTML = ''; }
let mode = 'login';
function showLogin(msg, ok) {
  const reg = mode === 'register';
  gate('<div class="glogo" aria-hidden="true"></div><h1>Haushaltsbuch</h1><p class="gsub">' + (reg ? 'Neues Konto anlegen' : 'Bitte melde dich an') + '</p>' +
    (reg ? '<label class="field"><span>Dein Vorname</span><input class="input" id="g-name" autocomplete="given-name"></label>' : '') +
    '<label class="field"><span>E-Mail</span><input class="input" id="g-mail" type="email" autocomplete="email" inputmode="email"></label>' +
    '<label class="field"><span>Passwort</span><input class="input" id="g-pass" type="password" autocomplete="' + (reg ? 'new-password' : 'current-password') + '"></label>' +
    '<p class="' + (ok ? 'gok' : 'err') + '" role="alert" id="g-msg">' + esc(msg || '') + '</p>' +
    '<button class="btn primary" id="g-go">' + (reg ? 'Konto anlegen' : 'Anmelden') + '</button>' +
    '<button class="linkbtn" id="g-switch">' + (reg ? 'Ich habe schon ein Konto' : 'Neues Konto anlegen') + '</button>' +
    (reg ? '' : '<button class="linkbtn" id="g-reset">Passwort vergessen</button>'));
}
document.addEventListener('click', async (ev) => {
  const t = ev.target.closest && ev.target.closest('button'); if (!t) return;
  const msg = (m, ok) => { const el = $('#g-msg'); if (el) { el.textContent = m; el.className = ok ? 'gok' : 'err'; } };
  if (t.id === 'g-switch') { mode = mode === 'login' ? 'register' : 'login'; showLogin(); }
  else if (t.id === 'g-reset') {
    const mail = ($('#g-mail').value || '').trim(); if (!mail) return msg('Bitte trag oben deine E-Mail ein.');
    try { await sendPasswordResetEmail(auth, mail); msg('Wir haben dir eine E-Mail zum Zurücksetzen geschickt.', true); } catch (e) { msg(AUTHERR[e.code] || 'Das hat nicht geklappt.'); }
  } else if (t.id === 'g-go') {
    const mail = ($('#g-mail').value || '').trim(), pass = $('#g-pass').value || '';
    if (!mail || !pass) return msg('Bitte E-Mail und Passwort eingeben.');
    t.disabled = true;
    try {
      if (mode === 'register') {
        const name = ($('#g-name').value || '').trim();
        if (!name) { t.disabled = false; return msg('Bitte gib deinen Vornamen ein.'); }
        const c = await createUserWithEmailAndPassword(auth, mail, pass);
        try { await updateProfile(c.user, { displayName: name }); } catch (e) {}
      } else await signInWithEmailAndPassword(auth, mail, pass);
    } catch (e) { t.disabled = false; msg(AUTHERR[e.code] || 'Das hat nicht geklappt (' + (e.code || 'Fehler') + ').'); }
  } else if (t.id === 'g-out') HH.logout();
});

function showPending(user) {
  const name = user.displayName || '';
  gate('<div class="glogo" aria-hidden="true"></div><h1>Fast geschafft</h1><p class="gsub">' + (name ? 'Hallo ' + esc(name) + '. ' : '') +
    'Georg muss dich noch freigeben. Sobald er das gemacht hat, öffnet sich das Haushaltsbuch hier von selbst.</p>' +
    '<p class="gsub">Angemeldet als ' + esc(user.email || '') + '</p><button class="linkbtn" id="g-out">Abmelden</button>');
  setDoc(doc(db, 'hh_requests', user.uid), { name, email: user.email || '', created: Date.now() }).catch(() => {});
}

let unsubMembers = null, unsubReq = null, unsubAi = null;
async function afterMember() {
  if (HH.started) { hideGate(); return; }
  try { const s = await getDoc(doc(db, 'hh_meta', 'ai')); if (s.exists()) HH.ai = Object.assign({ provider: 'claude', key: '' }, s.data()); } catch (e) {}
  HH.started = true; hideGate();
  unsubAi = onSnapshot(doc(db, 'hh_meta', 'ai'), (s) => { if (s.exists()) { HH.ai = Object.assign({ provider: 'claude', key: '' }, s.data()); emit(); } }, () => {});
  if (HH.isAdmin) unsubReq = onSnapshot(collection(db, 'hh_requests'), (s) => { HH.requests = s.docs.map((d) => Object.assign({ uid: d.id }, d.data())); emit(); }, () => {});
  window.__startApp();
}
onAuthStateChanged(auth, (user) => {
  if (unsubMembers) { unsubMembers(); unsubMembers = null; }
  if (!user) { HH.uid = null; showLogin(); return; }
  HH.uid = user.uid; HH.email = user.email || ''; HH.isAdmin = user.uid === ADMIN_UID;
  gate('<div class="glogo" aria-hidden="true"></div><p class="gsub">Wird geladen …</p>');
  unsubMembers = onSnapshot(doc(db, 'hh_meta', 'members'), (snap) => {
    const d = snap.exists() ? snap.data() : {};
    HH.members = { uids: d.uids || [], names: Object.assign({}, d.names || {}) };
    if (!HH.members.names[ADMIN_UID]) HH.members.names[ADMIN_UID] = 'Georg';
    HH.member = HH.isAdmin || HH.members.uids.includes(user.uid);
    if (HH.member) afterMember(); else showPending(user);
    emit();
  }, () => gate('<h1>Haushaltsbuch</h1><p class="err">Die Daten konnten nicht geladen werden. Bitte prüfe das Internet und lade die Seite neu.</p><button class="linkbtn" id="g-out">Abmelden</button>'));
});

</script>
